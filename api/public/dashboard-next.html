<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <title>Sentinelpay | Dashboard</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/jakarta-latin.woff2" as="font" type="font/woff2" crossorigin>
    <script>(function(){var m;try{m=localStorage.getItem('sp-theme')}catch(e){}if(m!=='dark'&&m!=='light'&&m!=='system')m='system';var d=m==='dark'||(m==='system'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');document.documentElement.setAttribute('data-theme-mode',m);})();</script>
    <link rel="stylesheet" href="/fonts.2.css">
    <link rel="stylesheet" href="/dash.46.css">
</head>
<body>
    <div class="app" id="app">
        <aside class="side" id="side">
            <a class="side-brand" href="/dashboard" aria-label="Sentinelpay">
                <img class="side-mark" src="/logo.svg" alt="Sentinelpay" width="28" height="28">
            </a>
            <nav class="side-nav" id="side-nav" aria-label="Dashboard"></nav>
            <div class="side-foot" id="side-foot"></div>
        </aside>

        <div class="main">
            <header class="top">
                <button type="button" class="menu-btn" id="menu-btn" aria-label="Menu" aria-expanded="false">
                    <span class="hb-l"></span><span class="hb-l"></span><span class="hb-l"></span>
                </button>
                <div class="top-slot" id="top-slot"></div>
                <div class="top-side">
                    <div class="acct" id="acct">
                        <button type="button" class="acct-btn" id="acct-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="acct-pop">
                            <span class="who" id="who">
                                <span class="who-name" id="who-name"></span>
                                <span class="who-mail" id="who-mail"></span>
                            </span>
                            <span class="avatar" id="avatar"><span class="avatar-in" id="avatar-in"></span></span>
                        </button>
                        <div class="acct-pop" id="acct-pop" role="menu"></div>
                    </div>
                </div>
            </header>

            <main class="canvas" id="canvas"></main>
        </div>

        <div class="scrim" id="scrim"></div>
    </div>
    <script src="/i18n.150.js" defer></script>
    <script src="/dash-app.36.js" defer></script>
</body>
</html>
