    <style>
        html.theme-light {
            --bg-dark: #f6f7f9; --bg-panel: rgba(255,255,255,0.75);
            --border-glass: rgba(20,20,30,0.08); --text-main: #15161a; --text-muted: #82828c;
            --accent-glow: rgba(0,145,200,0.12); --accent-light: #0091c8; --neon-blue: #0091c8;
        }
        html.theme-light body.lp-body { background: linear-gradient(180deg, #fbfcfd 0%, #eef0f3 100%) fixed; }

        .sp-auth-shell {
            position: relative;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 5.5rem 1.25rem 4rem;
            box-sizing: border-box;
            overflow: hidden;
        }
        .sp-auth-glow { position: absolute; border-radius: 50%; filter: blur(90px); pointer-events: none; }
        .sp-auth-glow-a { top: -16vh; left: 50%; width: 44rem; height: 28rem; transform: translateX(-64%); background: rgba(0, 145, 200, 0.1); }
        .sp-auth-glow-b { bottom: -20vh; left: 50%; width: 38rem; height: 26rem; transform: translateX(-20%); background: rgba(160, 32, 240, 0.07); }
        .sp-auth-back {
            position: absolute; top: 1.5rem; left: 1.5rem;
            display: inline-flex; align-items: center; gap: 0.4rem;
            font-size: 0.86rem; font-weight: 500; color: rgba(14, 35, 88, 0.55);
            text-decoration: none; padding: 0.5rem 0.7rem; border-radius: 9px;
            transition: color 0.18s ease, background 0.18s ease;
        }
        .sp-auth-back svg { width: 15px; height: 15px; }
        .sp-auth-back:hover { color: #0e2358; background: rgba(14, 35, 88, 0.05); }
        .sp-auth-foot {
            position: relative; z-index: 1;
            margin-top: 2.4rem; display: flex; align-items: center; gap: 0.6rem;
            font-size: 0.78rem; color: rgba(14, 35, 88, 0.28);
        }
        .sp-auth-foot a { color: rgba(14, 35, 88, 0.45); text-decoration: none; }
        .sp-auth-foot a:hover { color: #0e2358; }

        /* the invitation: one card, the same one the sign in opens in */
        .ivp-stage { position: relative; z-index: 1; width: 100%; max-width: 28rem; }
        .ivp-card {
            display: block !important;
            padding: 2rem 2rem 1.8rem !important;
            border-radius: 22px;
            text-align: left;
        }
        .ivp-body { position: relative; z-index: 1; }
        .ivp-mark {
            display: grid; place-items: center;
            width: 3rem; height: 3rem; margin: 0 auto 1.1rem;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(0, 190, 220, 0.16), rgba(160, 32, 240, 0.16));
            border: 1px solid rgba(14, 35, 88, 0.08);
            color: #0e2358; font-family: var(--sp-display, inherit); font-size: 1.2rem; font-weight: 800;
        }
        .ivp-mark svg { width: 22px; height: 22px; }
        .ivp-mark.is-warn { background: #fff7e8; border-color: rgba(176, 112, 0, 0.22); color: #8a5800; }
        .ivp-mark.is-off { background: #f3f5f9; color: rgba(14, 35, 88, 0.5); }
        .ivp-eyebrow {
            margin: 0 0 0.35rem; text-align: center;
            font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #0091c8;
        }
        .ivp-h {
            margin: 0 0 0.45rem; text-align: center;
            font-size: 1.55rem; font-weight: 800; line-height: 1.2; letter-spacing: -0.02em;
            color: #0e2358; text-transform: none; overflow-wrap: anywhere;
        }
        .ivp-p { margin: 0 auto; max-width: 34ch; text-align: center; font-size: 0.92rem; line-height: 1.6; color: rgba(14, 35, 88, 0.62); }
        .ivp-p b { color: #0e2358; font-weight: 600; }
        .ivp-facts { margin: 1.4rem 0 0; padding: 0; border-top: 1px solid rgba(14, 35, 88, 0.08); }
        .ivp-fact {
            display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: 0.8rem;
            padding: 0.62rem 0; border-bottom: 1px solid rgba(14, 35, 88, 0.08);
            font-size: 0.86rem;
        }
        .ivp-fact dt { margin: 0; color: rgba(14, 35, 88, 0.55); }
        .ivp-fact dd { margin: 0; color: #0e2358; font-weight: 600; overflow-wrap: anywhere; }
        .ivp-fact dd small { display: block; margin-top: 0.1rem; font-size: 0.78rem; font-weight: 500; color: rgba(14, 35, 88, 0.55); }
        .ivp-note {
            display: flex; gap: 0.7rem; align-items: flex-start;
            margin: 1.2rem 0 0; padding: 0.85rem 0.95rem;
            border-radius: 12px; border: 1px solid rgba(14, 35, 88, 0.1); background: #f6f8fb;
            font-size: 0.84rem; line-height: 1.55; color: rgba(14, 35, 88, 0.72);
        }
        .ivp-note b { color: #0e2358; font-weight: 600; }
        .ivp-note-t { min-width: 0; overflow-wrap: anywhere; }
        .ivp-note-h { display: block; margin-bottom: 0.15rem; font-weight: 700; color: #0e2358; }
        .ivp-note-i { flex: none; width: 18px; height: 18px; margin-top: 0.1rem; color: #0091c8; }
        .ivp-note.is-warn { border-color: rgba(176, 112, 0, 0.28); background: #fff8eb; }
        .ivp-note.is-warn .ivp-note-i { color: #9a6400; }
        .ivp-acts { display: grid; gap: 0.55rem; margin-top: 1.4rem; }
        .ivp-acts .lp-demo-submit { width: 100%; }
        .ivp-btn2 {
            width: 100%; padding: 0.78rem 1rem; border-radius: 10px;
            border: 1px solid rgba(14, 35, 88, 0.14); background: #fff;
            font-family: var(--sp-text); font-size: 0.85rem; font-weight: 600; color: #0e2358;
            cursor: pointer; transition: border-color 0.18s ease, background 0.18s ease;
            text-align: center; text-decoration: none; display: block; box-sizing: border-box;
        }
        .ivp-btn2:hover { border-color: rgba(14, 35, 88, 0.3); background: #f8f9fc; }
        .ivp-btn2.is-bad { color: #b4232f; }
        .ivp-btn2.is-bad:hover { border-color: rgba(180, 35, 47, 0.4); background: #fff6f6; }
        .ivp-btn2:disabled, .ivp-acts .lp-demo-submit:disabled { opacity: 0.55; cursor: not-allowed; }
        .lp-demo-submit.is-bad { background: #b4232f; }
        .lp-demo-submit.is-bad:hover { background: #9c1d28; box-shadow: 0 12px 28px -12px rgba(180, 35, 47, 0.55); }
        .ivp-who { margin: 1rem 0 0; text-align: center; font-size: 0.8rem; color: rgba(14, 35, 88, 0.55); overflow-wrap: anywhere; }
        .ivp-who b { color: #0e2358; font-weight: 600; }
        .ivp-link { padding: 0; border: 0; background: none; font: inherit; color: #0091c8; cursor: pointer; text-decoration: none; }
        .ivp-link:hover { text-decoration: underline; }
        .ivp-err { margin: 0.9rem 0 0; text-align: center; font-size: 0.84rem; line-height: 1.5; color: #b4232f; }
        .ivp-err[hidden] { display: none; }
        .ivp-wait { display: grid; gap: 0.7rem; justify-items: center; padding: 0.4rem 0; }
        .ivp-wait span { display: block; height: 0.8rem; border-radius: 6px; background: #eef1f6; animation: ivpPulse 1.2s ease-in-out infinite alternate; }
        .ivp-wait .w1 { width: 3rem; height: 3rem; border-radius: 14px; }
        .ivp-wait .w2 { width: 70%; height: 1.4rem; }
        .ivp-wait .w3 { width: 85%; }
        .ivp-wait .w4 { width: 100%; height: 2.7rem; margin-top: 1rem; border-radius: 10px; }
        @keyframes ivpPulse { from { opacity: 0.55; } to { opacity: 1; } }
        .ivp-in { animation: ivpIn 0.32s cubic-bezier(0.22, 1, 0.36, 1) both; }
        @keyframes ivpIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
        @media (prefers-reduced-motion: reduce) { .ivp-in, .ivp-wait span { animation: none; } }
        /* the address the invitation is for, fixed in the sign in */
        .sp-authm input.ivp-locked { background: #f3f5f9 !important; color: rgba(14, 35, 88, 0.7) !important; cursor: default; }

        @media (max-width: 560px) {
            .sp-auth-shell { padding: 4.5rem 1rem 3rem; justify-content: flex-start; }
            .sp-auth-back { top: 0.9rem; left: 0.9rem; }
            .ivp-card { padding: 1.6rem 1.25rem 1.4rem !important; }
            .ivp-h { font-size: 1.35rem; }
            .ivp-fact { grid-template-columns: 6.2rem minmax(0, 1fr); }
            .sp-auth-foot { margin-top: 2rem; flex-wrap: wrap; justify-content: center; text-align: center; }
        }
    </style>
